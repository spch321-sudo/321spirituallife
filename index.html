body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:calc(16px*var(--fs));line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 8px}

.icb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icb svg{width:22px;height:22px;stroke:var(--ink)}
main{max-width:640px;margin:0 auto;padding:4px 16px 24px}

h2{font-size:1.15em;margin:22px 0 10px}
.sub{color:var(--mute);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:var(--sh)}

.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9em}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}

.vs{font-size:1.12em;line-height:1.95}

.ref{color:var(--mute);font-size:.88em;margin-top:6px}

.banner{background:var(--accS);border-radius:16px;padding:14px 16px;margin:10px 0}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85em;color:var(--mute)}

.lock{opacity:.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.ov.show{display:block}
.ovh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;z-index:2}

.big{font-size:4.2em;font-weight:700;color:var(--acc);line-height:1;font-family:"Noto Serif TC",serif}

.stepfoot .btn{flex:1}
.light{border-left:3px solid var(--acc);padding:6px 0 6px 14px;margin:16px 0;color:var(--ink)}
.q{margin:18px 0 6px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}
.opt.on{border-color:var(--acc);background:var(--accS)}
.breath{width:150px;height:150px;border-radius:50%;margin:26px auto;background:radial-gradient(circle,var(--accS),transparent 70%);border:2px solid var(--acc);animation:br 8s ease-in-out infinite}

.stat{font-size:2.2em;font-weight:700;color:var(--acc);line-height:1.1}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}

.tl .it:before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .it .d{font-size:.78em;color:var(--mute)}
.tag{font-size:.72em;padding:1px 8px;border-radius:8px;background:var(--accS);color:var(--acc);margin-left:6px}

.mod{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.mod b{display:block}
.mod span{font-size:.8em;color:var(--mute)}
.seg{display:flex;background:var(--accS);border-radius:14px;padding:4px;margin:8px 0}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:.9em}
.seg button.on{background:var(--card);font-weight:600;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.9em;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.foot{text-align:center;color:var(--mute);font-size:.82em;margin:28px 0 8px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:.92em}
.done-mark{width:84px;height:84px;margin:30px auto 10px;border-radius:50%;background:var(--accS);display:flex;align-items:center;justify-content:center}
.done-mark svg{width:42px;height:42px;stroke:var(--acc)}
.li .n svg{width:18px;height:18px;stroke:#fff}
.btn{white-space:nowrap;flex:none}
.btn svg{width:18px;height:18px;stroke:currentColor}
.heroimg{display:block;width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:22px;margin:18px auto 0;box-shadow:0 8px 28px rgba(60,45,20,.18)}
html[data-th=night] .btn.ghost{color:var(--acc)}
.prog{height:6px;border-radius:3px;background:var(--line);margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.card.wk{padding:4px 14px}
.card.wk.cur{border-color:var(--acc)}
.chev svg{width:20px;height:20px;stroke:var(--mute);transition:transform .2s}
.chev.up svg{transform:rotate(180deg)}
.li.sm{padding:9px 2px}
.li.sm .n{width:30px;height:30px}
.scale{display:flex;gap:8px;margin:6px 0 4px}
.scale button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-th=night] .scale button.on{color:#1B2337}
.radar{display:block;width:100%;max-width:400px;margin:8px auto}
.radar .rn{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:2}
.radar .rp{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 4}
.lg{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:4px;border-radius:2px}
.lg.rn{background:var(--acc)}.lg.rp{background:var(--mute)}
</style>

var SYL=[{"w":1,"m":0,"t":"回家：福音與新身分","mem":"哥林多後書 5:17","memT":"若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。"},{"w":2,"m":3,"t":"安靜：學習靜候主","mem":"詩篇 46:10","memT":"你們要休息，要知道我是上帝！我必在外邦中被尊崇，在遍地上也被尊崇。"},{"w":3,"m":1,"t":"讀經：與神相遇的四步","mem":"詩篇 119:105","memT":"你的話是我腳前的燈，是我路上的光。"},{"w":4,"m":2,"t":"禱告：主禱文","mem":"馬太福音 6:10","memT":"願你的國降臨；願你的旨意行在地上，如同行在天上。"},{"w":5,"m":4,"t":"謙卑：回到人的本位","mem":"雅各書 4:6","memT":"但他賜更多的恩典，所以經上說：上帝阻擋驕傲的人，賜恩給謙卑的人。"},{"w":6,"m":5,"t":"得勝：謙卑戰勝驕傲","mem":"雅各書 4:7","memT":"故此，你們要順服上帝。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。"},{"w":7,"m":6,"t":"安息：生活的節奏","mem":"馬太福音 11:28","memT":"凡勞苦擔重擔的人可以到我這裏來，我就使你們得安息。"},{"w":8,"m":0,"t":"確據：得救的確信","mem":"約翰一書 5:13","memT":"我將這些話寫給你們信奉上帝兒子之名的人，要叫你們知道自己有永生。"},{"w":9,"m":1,"t":"默想：晝夜思想","mem":"約書亞記 1:8","memT":"這律法書不可離開你的口，總要晝夜思想，好使你謹守遵行這書上所寫的一切話。如此，你的道路就可以亨通，凡事順利。"},{"w":10,"m":2,"t":"敬拜：凡事謝恩","mem":"帖撒羅尼迦前書 5:16–18","memT":"要常常喜樂，不住地禱告，凡事謝恩；因為這是上帝在基督耶穌裏向你們所定的旨意。"},{"w":11,"m":3,"t":"聖靈：用心靠聖靈","mem":"加拉太書 5:16","memT":"我說，你們當順着聖靈而行，就不放縱肉體的情慾了。"},{"w":12,"m":4,"t":"捨己：為耶穌為別人","mem":"馬可福音 10:45","memT":"因為人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價。」"},{"w":13,"m":-1,"t":"退修：扎根回顧","mem":"約翰福音 15:5","memT":"我是葡萄樹，你們是枝子。常在我裏面的，我也常在他裏面，這人就多結果子；因為離了我，你們就不能做甚麼。"},{"w":14,"m":0,"t":"身分：在基督裏的我","mem":"以弗所書 2:10","memT":"我們原是他的工作，在基督耶穌裏造成的，為要叫我們行善，就是上帝所預備叫我們行的。"},{"w":15,"m":1,"t":"讀經：查考腓立比書","mem":"腓立比書 4:13","memT":"我靠着那加給我力量的，凡事都能做。"},{"w":16,"m":2,"t":"禱告：認罪與饒恕","mem":"約翰一書 1:9","memT":"我們若認自己的罪，上帝是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。"},{"w":17,"m":3,"t":"聖靈：被聖靈充滿","mem":"以弗所書 5:18","memT":"不要醉酒，酒能使人放蕩；乃要被聖靈充滿。"},{"w":18,"m":4,"t":"謙卑：驕傲的根源與解藥","mem":"彼得前書 5:5","memT":"你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服；因為上帝阻擋驕傲的人，賜恩給謙卑的人。"},{"w":19,"m":5,"t":"得勝：試探與勝過","mem":"哥林多前書 10:13","memT":"你們所遇見的試探，無非是人所能受的。上帝是信實的，必不叫你們受試探過於所能受的；在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。"},{"w":20,"m":6,"t":"管家：時間是神的","mem":"以弗所書 5:15–16","memT":"你們要謹慎行事，不要像愚昧人，當像智慧人。要愛惜光陰，因為現今的世代邪惡。"},{"w":21,"m":0,"t":"無己：不再是我","mem":"加拉太書 2:20","memT":"我已經與基督同釘十字架，現在活着的不再是我，乃是基督在我裏面活着；並且我如今在肉身活着，是因信上帝的兒子而活；他是愛我，為我捨己。"},{"w":22,"m":1,"t":"讀經：讓神的話住在心裏","mem":"歌羅西書 3:16","memT":"當用各樣的智慧，把基督的道理豐豐富富地存在心裏，用詩章、頌詞、靈歌，彼此教導，互相勸戒，心被恩感，歌頌上帝。"},{"w":23,"m":2,"t":"禱告：代禱的事奉","mem":"提摩太前書 2:1","memT":"我勸你，第一要為萬人懇求、禱告、代求、祝謝；"},{"w":24,"m":3,"t":"聖靈：分辨與順服","mem":"羅馬書 8:14","memT":"因為凡被上帝的靈引導的，都是上帝的兒子。"},{"w":25,"m":4,"t":"捨己：背起十字架","mem":"路加福音 9:23","memT":"耶穌又對眾人說：「若有人要跟從我，就當捨己，天天背起他的十字架來跟從我。"},{"w":26,"m":-1,"t":"退修：成長回顧","mem":"腓立比書 3:13–14","memT":"弟兄們，我不是以為自己已經得着了；我只有一件事，就是忘記背後，努力面前的，向着標竿直跑，要得上帝在基督耶穌裏從上面召我來得的獎賞。"},{"w":27,"m":4,"t":"920：每個人都是我的 2","mem":"約翰福音 13:34","memT":"我賜給你們一條新命令，乃是叫你們彼此相愛；我怎樣愛你們，你們也要怎樣相愛。"},{"w":28,"m":4,"t":"聖靈果子：仁愛","mem":"哥林多前書 13:4","memT":"愛是恆久忍耐，又有恩慈；愛是不嫉妒；愛是不自誇，不張狂，"},{"w":29,"m":4,"t":"聖靈果子：喜樂","mem":"腓立比書 4:4","memT":"你們要靠主常常喜樂。我再說，你們要喜樂。"},{"w":30,"m":4,"t":"聖靈果子：和平","mem":"羅馬書 12:18","memT":"若是能行，總要盡力與眾人和睦。"},{"w":31,"m":4,"t":"聖靈果子：忍耐","mem":"雅各書 1:4","memT":"但忍耐也當成功，使你們成全、完備，毫無缺欠。"},{"w":32,"m":4,"t":"聖靈果子：恩慈","mem":"以弗所書 4:32","memT":"並要以恩慈相待，存憐憫的心，彼此饒恕，正如上帝在基督裏饒恕了你們一樣。"},{"w":33,"m":4,"t":"聖靈果子：良善","mem":"加拉太書 6:9","memT":"我們行善，不可喪志；若不灰心，到了時候就要收成。"},{"w":34,"m":4,"t":"聖靈果子：信實","mem":"哥林多前書 4:2","memT":"所求於管家的，是要他有忠心。"},{"w":35,"m":4,"t":"聖靈果子：溫柔","mem":"馬太福音 11:29","memT":"我心裏柔和謙卑，你們當負我的軛，學我的樣式；這樣，你們心裏就必得享安息。"},{"w":36,"m":4,"t":"聖靈果子：節制","mem":"哥林多前書 9:25","memT":"凡較力爭勝的，諸事都有節制，他們不過是要得能壞的冠冕；我們卻是要得不能壞的冠冕。"},{"w":37,"m":5,"t":"得勝：饒恕與修復關係","mem":"歌羅西書 3:13","memT":"倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。"},{"w":38,"m":6,"t":"安息：家庭與工作的節奏","mem":"詩篇 127:2","memT":"你們清晨早起，夜晚安歇，吃勞碌得來的飯，本是枉然；惟有耶和華所親愛的，必叫他安然睡覺。"},{"w":39,"m":-1,"t":"退修：結果回顧","mem":"加拉太書 5:22–23","memT":"聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。"},{"w":40,"m":0,"t":"繁殖：一粒麥子","mem":"約翰福音 12:24","memT":"我實實在在地告訴你們，一粒麥子不落在地裏死了，仍舊是一粒，若是死了，就結出許多子粒來。"},{"w":41,"m":4,"t":"2 屬靈同伴：同行的友誼","mem":"傳道書 4:9–10","memT":"兩個人總比一個人好，因為二人勞碌同得美好的果效。若是跌倒，這人可以扶起他的同伴；若是孤身跌倒，沒有別人扶起他來，這人就有禍了。"},{"w":42,"m":4,"t":"3 屬靈父母：保羅與提摩太","mem":"提摩太後書 2:2","memT":"你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。"},{"w":43,"m":0,"t":"見證：作主的見證人","mem":"使徒行傳 1:8","memT":"但聖靈降臨在你們身上，你們就必得着能力，並要在耶路撒冷、猶太全地，和撒馬利亞，直到地極，作我的見證。」"},{"w":44,"m":1,"t":"帶讀經：教人讀神的話","mem":"提摩太後書 3:16–17","memT":"聖經都是上帝所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬上帝的人得以完全，預備行各樣的善事。"},{"w":45,"m":2,"t":"同心禱告：禱告的團隊","mem":"馬太福音 18:19–20","memT":"我又告訴你們，若是你們中間有兩個人在地上同心合意地求甚麼事，我在天上的父必為他們成全。因為無論在哪裏，有兩三個人奉我的名聚會，那裏就有我在他們中間。」"},{"w":46,"m":3,"t":"恩賜：聖靈的恩賜","mem":"彼得前書 4:10","memT":"各人要照所得的恩賜彼此服事，作上帝百般恩賜的好管家。"},{"w":47,"m":3,"t":"5 屬靈戰友：五重職分","mem":"以弗所書 4:11–12","memT":"他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，為要成全聖徒，各盡其職，建立基督的身體，"},{"w":48,"m":5,"t":"屬靈爭戰：全副軍裝","mem":"以弗所書 6:10–11","memT":"我還有末了的話：你們要靠着主，倚賴他的大能大力作剛強的人。要穿戴上帝所賜的全副軍裝，就能抵擋魔鬼的詭計。"},{"w":49,"m":6,"t":"管家：金錢與奉獻","mem":"瑪拉基書 3:10","memT":"萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。"},{"w":50,"m":4,"t":"合一：無己才能合一","mem":"約翰福音 17:21","memT":"使他們都合而為一。正如你父在我裏面，我在你裏面，使他們也在我們裏面，叫世人可以信你差了我來。"},{"w":51,"m":2,"t":"國度：建立屬神的體系","mem":"馬太福音 6:33","memT":"你們要先求他的國和他的義，這些東西都要加給你們了。"},{"w":52,"m":-1,"t":"退修：得勝者的一年","mem":"啟示錄 3:21","memT":"得勝的，我要賜他在我寶座上與我同坐，就如我得了勝，在我父的寶座上與他同坐一般。"}];
var W1={"w":1,"mem":{"ref":"哥林多後書 5:17","t":"若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。"},"lessons":[{"title":"浪子回家","theme":"屬靈生活的起點不是努力，而是回家","passages":[{"ref":"路加福音 15:20–24","v":[[20,"於是起來，往他父親那裏去。相離還遠，他父親看見，就動了慈心，跑去抱着他的頸項，連連與他親嘴。"],[21,"兒子說：『父親！我得罪了天，又得罪了你；從今以後，我不配稱為你的兒子。』"],[22,"父親卻吩咐僕人說：『把那上好的袍子快拿出來給他穿；把戒指戴在他指頭上；把鞋穿在他腳上；"],[23,"把那肥牛犢牽來宰了，我們可以吃喝快樂；"],[24,"因為我這個兒子是死而復活，失而又得的。』他們就快樂起來。"]]}],"more":"路加福音 15:11–32","still":"深深吸一口氣，慢慢吐出。告訴主：「主啊，我回來了。」把心裏的忙亂、愧疚、重擔，像放下行囊一樣，放在父親腳前。","teach":["很多人以為屬靈生活是一張「表現考核表」：讀經幾章、禱告多久、犯錯幾次。可是浪子的故事告訴我們，屬靈生活的第一步不是「做得更好」，而是「轉身回家」。","請注意父親的動作：「看見」、「動了慈心」、「跑去」、「抱着」、「親嘴」——五個動詞全是父親主動。兒子準備好的認罪稿還沒唸完，父親就打斷了他，給他袍子（尊榮）、戒指（權柄）、鞋子（兒子的身分，奴僕是赤腳的）。","這就是福音：神不是等我們變好才接納我們，而是接納我們，使我們變好。改變觀念就改變生命——從「我要努力讓神愛我」，改變成「神已經愛我，我回應祂的愛」。"],"light":"321 光照：浪子離家，是「有己」的極致——「把我應得的家業分給我」，要自己作主。回家，是放下自己作王，回到兒子的本位。謙卑是復興的鑰匙，而回家就是謙卑的第一步。","q":["神是誰？——從父親的五個動作，你看見怎樣的神？","我是誰？——你比較像離家時的浪子、回家路上的浪子，還是在家卻心遠離的大兒子？","我該怎樣回應？——今天有哪一件事，你需要「轉身回家」？"],"jesus":"說這比喻的耶穌，正是那位「跑去」的父親心意的化身。祂離開天上的家，走到遠方來找我們；祂在十字架上被剝去衣服，好讓我們穿上上好的袍子。","pray":"天父，謝謝你在我還相離很遠的時候，就看見我、跑向我。我不再用自己的表現來換你的愛，我承認我需要你。今天我回家了，求你作我生命的主。奉主耶穌的名，阿們。","acts":["寫下一句話：「我回家了，因為……」","對一位家人或朋友說一句接納、不帶條件的話","今天做一件事之前，先默禱：「父啊，我回來了。」"],"noon":"「相離還遠，他父親看見，就動了慈心，跑去抱着他。」——主啊，此刻我也回到你懷裏。"},{"title":"看見自己的問題：有己","theme":"人類墮落的根源，是想要代替神","passages":[{"ref":"創世記 3:5–6","v":[[5,"因為上帝知道，你們吃的日子眼睛就明亮了，你們便如上帝能知道善惡。」"],[6,"於是女人見那棵樹的果子好作食物，也悅人的眼目，且是可喜愛的，能使人有智慧，就摘下果子來吃了，又給她丈夫，她丈夫也吃了。"]]},{"ref":"以賽亞書 53:6","v":[[6,"我們都如羊走迷；各人偏行己路；耶和華使我們眾人的罪孽都歸在他身上。"]]}],"more":"創世記 3:1–13","still":"安靜片刻，求聖靈像手電筒照進心裏：「主啊，求你鑒察我，指出我裏面以自己為中心的地方。」不急，不辯解，只是讓祂照亮。","teach":["蛇的引誘核心是一句話：「你們便如神。」問題不只在於吃了一顆果子，而在於人想要離開「人的本位」，抓住「神的權力」，自己決定什麼是善、什麼是惡。","這就是「有己」：以自己為中心，自己要作主作王。它的外在表現就是驕傲。以賽亞說得更白：「各人偏行己路」——罪的本質就是「我的路」取代了「神的路」。","看見自己的問題不是為了定罪自己，而是為了得醫治。就像看醫生，先有正確的診斷，才有正確的藥方。今天的診斷書寫着：我的根本問題不是環境、不是別人，而是我裏面那個想作王的「己」。"],"light":"321 光照：驕傲是離開本位、抓住權力；謙卑是放下權力、回到本位——讓人作人，讓神作神。焦點不在別人的錯，而在我自己需要被主光照。","q":["神是誰？——神為人設立界限，是出於限制還是出於愛？","我是誰？——最近在哪一件事上，你想「自己決定善惡」、自己作主？","我該怎樣回應？——你願意把哪一個「我的路」交還給神？"],"jesus":"第一個亞當在園中說：「我要如神。」末後的亞當耶穌在客西馬尼園說：「不要成就我的意思，只要成就你的意思。」耶穌是無己的完美榜樣。","pray":"主啊，我承認我常偏行己路，想自己作主作王。謝謝你把我的罪孽都歸在你身上。求你拆毀我裏面的驕傲，讓我回到人的本位，讓你作神。阿們。","acts":["寫下一件你最近「自己作主」的事，並交託給主","今天遇到不如意時，先問：「此刻是誰在作王？」","向一位你曾驕傲對待的人，說一句謙卑的話"],"noon":"「我們都如羊走迷；各人偏行己路。」——主啊，此刻我放下我的路，跟隨你的路。"},{"title":"看見神的恩典：十字架","theme":"神為我們預備了徹底的解決","passages":[{"ref":"羅馬書 5:6–8","v":[[6,"因我們還軟弱的時候，基督就按所定的日期為罪人死。"],[7,"為義人死，是少有的；為仁人死，或者有敢做的。"],[8,"惟有基督在我們還作罪人的時候為我們死，上帝的愛就在此向我們顯明了。"]]},{"ref":"以弗所書 2:8–9","v":[[8,"你們得救是本乎恩，也因着信；這並不是出於自己，乃是上帝所賜的；"],[9,"也不是出於行為，免得有人自誇。"]]}],"more":"羅馬書 5:1–11","still":"想像自己站在十字架下。不需要說什麼，只要抬頭看。讓那份「在我還作罪人的時候」的愛，慢慢充滿你的心。","teach":["昨天我們看見問題，今天我們看見答案。保羅用三個詞形容我們的光景：「軟弱」、「罪人」，在別處還說「仇敵」。神的愛不是在我們最可愛的時候顯明，而是在我們最不可愛的時候。","十字架解決了兩件事：耶穌的死，解決了我們的罪行與罪性；耶穌的復活，賜給我們新生命。我們不是靠修補舊生命得救，而是領受一個全新的生命。","「本乎恩，也因着信」——恩典是神那一邊的禮物，信心是我們這一邊伸出的空手。禮物若要靠行為換取，就不再是禮物，人也就會自誇。福音拿走了一切自誇的理由，只留下感恩。"],"light":"321 光照：一切都是神在耶穌裏所作所成就的，都是神的恩典。所以榮耀不歸我，乃歸耶穌。藉着福音真理，我們才能無己。","q":["神是誰？——「在我們還作罪人的時候」，這句話讓你怎樣認識神的愛？","我是誰？——你是否仍暗暗想用好行為來「賺取」神的接納？","我該怎樣回應？——今天你要用什麼方式表達感恩？"],"jesus":"耶穌在十字架上說：「成了！」祂沒有留下一件要我們補完的工作。我們的操練不是去完成救恩，而是在已完成的救恩裏安息、回應。","pray":"主耶穌，謝謝你在我還作罪人的時候為我死。我放下自己的功勞，伸出空手領受你的恩典。從今天起，我的一生都是感恩的回應。一切榮耀歸給你。阿們。","acts":["寫下三件今天要為十字架感謝神的事","背誦以弗所書 2:8，在心裏默念三次","把「榮耀歸主」作為今天每件小事完成時的默禱"],"noon":"「惟有基督在我們還作罪人的時候為我們死。」——主啊，此刻我單單仰望你的恩典。"},{"title":"新造的人","theme":"不是我自己活，乃是基督在我裏面活","passages":[{"ref":"哥林多後書 5:17","v":[[17,"若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。"]]},{"ref":"加拉太書 2:20","v":[[20,"我已經與基督同釘十字架，現在活着的不再是我，乃是基督在我裏面活着；並且我如今在肉身活着，是因信上帝的兒子而活；他是愛我，為我捨己。"]]}],"more":"羅馬書 6:1–11","still":"把手放在胸口，安靜地說：「主耶穌，你住在我裏面。」感受那份同在，不是遠在天上，而是近在心裏。聖靈住在心中，不是住在腦中。","teach":["毛毛蟲不是靠努力「學飛」而變成蝴蝶，而是經過蛹裏的死亡與新生，生命本質改變了，自然就會飛。基督徒也是如此：我們不是一個「努力學好的舊人」，而是一個「新造的人」。","加拉太書 2:20 是無己生命的宣言：舊人有己的生命「同釘十字架」；新人無己的生命是「基督在我裏面活着」。無己不是變成沒有，乃是讓無限的基督在我裏面活出無限。","那麼為什麼我們還會失敗？因為我們常常忘記自己是誰，又回到舊人的習慣裏。所以每天的操練，就是一次又一次「改變觀念」：我已經是新造的人，今天我選擇讓基督在我裏面活。"],"light":"321 光照：無己讓耶穌在裏面活；無己才能讓耶穌作王；無己才能被聖靈引導。舊人有己的生命，變成新人無己的生命——這就是失敗的人生變成得勝的人生。","q":["神是誰？——「他是愛我，為我捨己」，你如何經歷這份個人的愛？","我是誰？——在哪一個領域，你還活得像「舊人」？","我該怎樣回應？——今天你要在哪件事上，讓基督在你裏面活？"],"jesus":"耶穌說：「我常作他所喜悅的事。」祂完全倚靠父而活。今天這位耶穌住在我裏面，祂的生命就是我得勝的生命。","pray":"主耶穌，謝謝你使我成為新造的人。舊事已過，我不再被過去定義。今天不是我自己活，乃是你在我裏面活。求你在我的言語、心思、反應中作王。阿們。","acts":["今天遇到挑戰時默念：「不再是我，乃是基督。」","寫下一個舊人的習慣，以及新人的回應方式","背誦本週經文：哥林多後書 5:17"],"noon":"「現在活着的不再是我，乃是基督在我裏面活着。」——主啊，此刻請你在我裏面活。"},{"title":"讓耶穌作王","theme":"捨己跟從主，是最自由的道路","passages":[{"ref":"路加福音 9:23–24","v":[[23,"耶穌又對眾人說：「若有人要跟從我，就當捨己，天天背起他的十字架來跟從我。"],[24,"因為，凡要救自己生命的，必喪掉生命；凡為我喪掉生命的，必救了生命。"]]},{"ref":"腓立比書 2:5–8","v":[[5,"你們當以基督耶穌的心為心："],[6,"他本有上帝的形像，不以自己與上帝同等為強奪的；"],[7,"反倒虛己，取了奴僕的形像，成為人的樣式；"],[8,"既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。"]]}],"more":"腓立比書 2:1–11","still":"安靜地把今天的計畫一件一件攤開在主面前，像把鑰匙一把一把交給主人。說：「主啊，這些都是你的。」","teach":["這一週我們走了一條路：回家（第1天）→ 看見有己（第2天）→ 看見恩典（第3天）→ 成為新人（第4天）→ 今天，讓耶穌作王。","「捨己」在耶穌口中有三個動作：捨己、天天背十字架、跟從。注意「天天」——讓耶穌作王不是一次性的決志，而是每天早上的選擇。就像一艘船，船長只能有一位；我若不下來，主就上不去。","腓立比書給我們看見耶穌的心：祂本有神的形像，卻「不以與神同等為強奪的」，反而虛己、卑微、順服。第一個亞當抓住權力想要成為神；耶穌放下權力成為人。這就是謙卑：放下權力，回到本位。"],"light":"321 光照：兩個核心——讓耶穌作王，讓耶穌得着一切的榮耀。捨己，就是為耶穌、為別人，不為自己。謙卑帶動謙卑，達到雙贏；這是建立屬神體系的開始。","q":["神是誰？——耶穌「虛己」的樣式，讓你看見怎樣的神？","我是誰？——在你生命的哪個房間，主還沒有掌權（時間、金錢、關係、夢想）？","我該怎樣回應？——今天你要把哪一把「鑰匙」交給主？"],"jesus":"耶穌就是「捨己」的活樣本：祂捨了天上的榮耀、捨了自己的意思、捨了自己的生命。祂不是只叫我們走這條路，而是先走在前面，並且住在我們裏面陪我們走。","pray":"主耶穌，我願意捨己，天天背起十字架跟從你。我把我生命的寶座讓給你，求你在我的時間、金錢、關係與夢想中作王。願你得着一切的榮耀。阿們。","acts":["寫下「我生命的房間」清單，把每一間交給主","做一件為別人、不為自己的小事，不讓人知道","明天（週六）與一位屬靈同伴分享這週的恩典"],"noon":"「若有人要跟從我，就當捨己。」——主啊，此刻我讓你作王。"}]};

/* ---------- content loading ---------- */
function prepWeek(o){each(o.lessons,function(l,i){l.w=o.w;l.day=i+1;l.id=lid(o.w,i+1);});WK[o.w]=o;return o;}
function loadWeek(w,cb){
  if(WK[w]){if(cb)cb(WK[w]);return;}
  var x=new XMLHttpRequest();x.open('GET','content/w'+pad(w)+'.json',true);
  x.onload=function(){if(x.status===200||(x.status===0&&x.responseText)){try{prepWeek(JSON.parse(x.responseText));if(cb)cb(WK[w]);return;}catch(e){}}if(cb)cb(null);};
  x.onerror=function(){if(cb)cb(null);};
  try{x.send();}catch(e){if(cb)cb(null);}
}
function lessonById(id){var p=parseId(id);if(!p||!WK[p.w])return null;return WK[p.w].lessons[p.d-1];}
function withLesson(id,cb){var p=parseId(id);if(!p)return;loadWeek(p.w,function(o){if(!o){toast('需要網路才能下載這一週的課程');return;}cb(o.lessons[p.d-1]);});}

/* ---------- state ---------- */
function blank(){return {v:2,onboard:false,name:'',since:'',mins:20,font:1,theme:'auto',gw:'神',grow:[],start:ymd(),done:{},titles:{},draft:{},journal:[],grace:[],prayers:[],cards:{},meet:{},lastOpen:'',partner:'',assess:{}};}
function fill(){var b=blank();for(var k in b)if(!(k in S))S[k]=b[k];}
function load(){try{var t=localStorage.getItem(KEY);S=t?JSON.parse(t):blank();}catch(e){S=blank();}fill();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存空間不足，請匯出備份');}}
function meetToday(){S.meet[ymd()]=1;}
function meetCount(){var y=String(new Date().getFullYear()),n=0;for(var k in S.meet)if(k.indexOf(y)===0)n++;return n;}
function nextPos(){for(var w=1;w<=52;w++)for(var d=1;d<=5;d++)if(!S.done[lid(w,d)])return {w:w,d:d};return null;}
function curWeek(){var p=nextPos();return p?p.w:52;}
function weekDone(w){var n=0;for(var d=1;d<=5;d++)if(S.done[lid(w,d)])n++;return n;}
function totalDone(){var n=0;for(var k in S.done)if(parseId(k))n++;return n;}
function doneToday(){var t=ymd(),n=0;for(var k in S.done)if(S.done[k]===t)n++;return n;}

/* ---------- theme ---------- */
function period(){var h=new Date().getHours();return h<11&&h>=4?'morning':(h<17&&h>=4?'noon':'night');}
function applyTheme(){var t=S.theme==='auto'?period():S.theme;document.documentElement.setAttribute('data-th',t==='morning'?'':t);
  document.documentElement.style.setProperty('--fs',S.font);
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='night'?'#121828':(t==='noon'?'#F4F6EF':'#FBF7EE'));}

/* ---------- router ---------- */
function go(v){view=v;if(v==='course'&&courseStage<0)courseStage=stageOf(curWeek());render();window.scrollTo(0,0);}
function render(){
  applyTheme();
  var h='';
  if(view==='today')h=vToday();
  else if(view==='course')h=vCourse();
  else if(view==='verse')h=vVerse();
  else if(view==='pray')h=vPray();
  else if(view==='grace')h=vGrace();
  $('main').innerHTML=h;
  each(document.querySelectorAll('nav.tabs button'),function(b){b.className=b.getAttribute('data-v')===view?'on':'';});
}

function openOv(html){var o=$('ov');o.innerHTML=html;o.className='ov show';o.scrollTop=0;document.body.style.overflow='hidden';}
function closeOv(){var o=$('ov');o.className='ov';o.innerHTML='';document.body.style.overflow='';stopSpeak();flow=null;render();}
function ovHead(mid){return '<div class="ovh"><button class="icb" data-act="close" aria-label="關閉">'+svg('x')+'</button><div>'+(mid||'')+'</div><div style="width:44px"></div></div>';}

/* ---------- devotion flow ---------- */
function stepList(){if(S.mins===10)return [0,1,4,5];return [0,1,2,3,4,5];}
function startFlow(id){withLesson(id,function(L){
  if(!S.draft[id])S.draft[id]={};
  flow={L:L,steps:stepList(),i:0,done:false};drawFlow();
  if(L.w<52)loadWeek(L.w+1);});}
function drawFlow(){
  var L=flow.L,A=S.draft[L.id],dots='';
  each(flow.steps,function(s,i){dots+='<i class="'+(i<=flow.i?'on':'')+'"></i>';});
  if(flow.done){openOv(ovHead('')+doneHtml());return;}
  var st=STEPS[flow.steps[flow.i]],b='';
  b+='<div class="big">'+st.n+'</div><div class="kick" style="margin-top:8px">'+st.d+'・'+st.m+'</div>';
  if(st.k==='still'){
    b+='<div class="sub" style="margin-top:12px">第 '+L.w+' 週 第 '+L.day+' 課・'+esc(syl(L.w).t)+'</div><div class="ttl serif">'+esc(L.title)+'</div><div class="breath"></div><div class="vs" style="font-size:1.02em">'+esc(L.still)+'</div><div class="sub" style="text-align:center;margin-top:12px">隨着圓圈吸氣、吐氣，至少三次</div>';
  } else if(st.k==='read'){
    b+='<div class="row sp" style="margin-top:12px"><span class="sub">'+esc(L.theme)+'</span><button class="btn sm ghost" data-act="speak">'+svg('sound')+'<span>聽經文</span></button></div>';
    each(L.passages,function(p){b+='<div class="card"><div class="kick">'+esc(p.ref)+'</div><div class="vs">'+verseHtml(p)+'</div></div>';});
    b+='<div class="sub">慢慢讀兩遍：第一遍讀懂，第二遍讓一個詞停在心裏。</div>';
    if(S.mins===30)b+='<div class="banner">延伸閱讀（30 分鐘版）：'+esc(L.more)+'</div>';
  } else if(st.k==='think'){
    each(L.teach,function(p){b+='<p>'+esc(p)+'</p>';});
    b+='<div class="light">'+esc(L.light)+'</div>';
    each(L.q,function(q,i){b+='<div class="q">'+esc(q)+'</div><textarea data-k="q'+i+'" placeholder="寫下聖靈給你的感動（可略過）">'+esc(A['q'+i]||'')+'</textarea>';});
  } else if(st.k==='see'){
    b+='<p class="vs" style="font-size:1.05em;margin-top:16px">'+esc(L.jesus)+'</p><div class="q">今天我看見的耶穌是……</div><textarea data-k="see" placeholder="用一句話寫下">'+esc(A.see||'')+'</textarea>';
  } else if(st.k==='pray'){
    b+='<div class="card vs" style="font-size:1.02em;margin-top:14px">'+esc(L.pray)+'</div><div class="q">用我自己的話對主說</div><textarea data-k="pray" placeholder="主啊……">'+esc(A.pray||'')+'</textarea>';
  } else if(st.k==='do'){
    b+='<div class="sub" style="margin-top:12px">選一個具體、小、今天就能做的行動</div>';
    each(L.acts,function(a,i){b+='<button class="opt'+(A.act===a?' on':'')+'" data-act="pick" data-i="'+i+'">'+esc(a)+'</button>';});
    b+='<div class="q">或者寫下你自己的行動</div><input data-k="own" value="'+esc(A.own||'')+'" placeholder="今天我要……">';
    if(isRetreat(L.w)&&L.day===4)b+='<div class="banner" style="margin-top:16px"><b>階段自評</b><div class="sub">用 5 分鐘誠實地回顧這一階段，看見神在你身上的恩典。</div><div style="margin-top:8px"><button class="btn sm" data-act="assess" data-s="'+stageOf(L.w)+'">開始屬靈健康自評</button></div></div>';
  }
  var last=flow.i===flow.steps.length-1;
  var foot='<div class="stepfoot">'+(flow.i>0?'<button class="btn ghost" data-act="prev">上一步</button>':'')+'<button class="btn" data-act="'+(last?'finish':'next')+'">'+(last?'完成，榮耀歸主':'下一步')+'</button></div>';
  openOv(ovHead('<div class="dots">'+dots+'</div>')+'<div class="stepbody">'+b+'</div>'+foot);
}
function grabInputs(){if(!flow||flow.done)return;var A=S.draft[flow.L.id];
  each($('ov').querySelectorAll('[data-k]'),function(e){A[e.getAttribute('data-k')]=e.value;});save();}
function finishFlow(){grabInputs();var L=flow.L,A=S.draft[L.id],t=ymd();
  var act=A.own&&A.own.replace(/\s/g,'')?A.own:(A.act||'');
  var j=findJournal('devo',t,L.id);
  var rec={id:uid(),kind:'devo',date:t,ts:Date.now(),lesson:L.id,title:L.title,a:{q0:A.q0||'',q1:A.q1||'',q2:A.q2||'',see:A.see||'',pray:A.pray||'',act:act}};
  if(j){rec.id=j.id;S.journal[S.journal.indexOf(j)]=rec;}else S.journal.push(rec);
  if(!S.done[L.id])S.done[L.id]=t;
  S.titles[L.id]=L.title;
  delete S.draft[L.id];meetToday();save();flow.done=true;flow.act=act;drawFlow();}
function doneHtml(){var L=flow.L,nx=nextPos(),wk=weekDone(L.w);
  var h='<div class="stepbody" style="text-align:center"><div class="done-mark">'+svg('check')+'</div><div class="ttl serif">一切榮耀歸給耶穌</div><p class="sub">不是我做了甚麼，乃是主在我裏面作了甚麼。</p>'+
    (flow.act?'<div class="card" style="text-align:left"><div class="kick">今天的實踐</div><div>'+esc(flow.act)+'</div></div>':'')+
    '<div class="card vs" style="text-align:left;font-size:1em">'+esc(L.noon.split('——')[0])+'</div>'+
    '<button class="btn full" data-act="addgrace" data-ty="靈修">記下一個恩典</button><div style="height:10px"></div><button class="btn ghost full" data-act="close">回到今日</button>';
  if(wk===5)h+='<p class="sub" style="margin-top:16px">第 '+L.w+' 週全部完成！週六記得與同伴分享，並複習背誦經文：'+esc(syl(L.w).mem)+'。</p>';
  else if(nx)h+='<p class="sub" style="margin-top:16px">下一課：第 '+nx.w+' 週第 '+nx.d+' 課（明天再來，讓真理慢慢扎根）</p>';
  if(!nx)h+='<p class="sub" style="margin-top:16px">全年 260 課完成！願你成為得勝者，與主同坐寶座。</p>';
  return h+'</div>';}

/* ---------- assessment ---------- */
var asDraft=null;
function openAssess(stage){var prev=S.assess[stage];asDraft={s:stage,v:prev?prev.items.slice():[]};drawAssess();}
function drawAssess(){var b='<div class="stepbody"><div class="big">評</div><div class="kick" style="margin-top:8px">屬靈健康自評・'+STAGES[asDraft.s].n+'階段</div>'+
  '<p class="sub">「你們總要自己省察有信心沒有，也要自己試驗。」（哥林多後書 13:5）不是為了打分數，而是為了看見恩典、找到下一步。1 = 很少，5 = 經常。</p>';
  var k=0;
  each(MODULES,function(m,i){b+='<h2>'+(i+1)+'. '+m.n+'</h2>';
    each(ASSESS[i],function(q){var v=asDraft.v[k];b+='<div class="q" style="font-weight:500">'+esc(q)+'</div><div class="scale">';
      for(var n=1;n<=5;n++)b+='<button class="'+(v===n?'on':'')+'" data-act="asv" data-k="'+k+'" data-n="'+n+'">'+n+'</button>';
      b+='</div>';k++;});});
  b+='</div><div class="stepfoot"><button class="btn" data-act="assave">看我的屬靈健康圖</button></div>';
  var y=$('ov').scrollTop;openOv(ovHead('')+b);$('ov').scrollTop=y;}
function saveAssess(){var n=0;each(asDraft.v,function(x){if(x)n++;});if(n<21){toast('還有 '+(21-n)+' 題未作答');return;}
  var sc=[];for(var i=0;i<7;i++)sc.push((asDraft.v[i*3]+asDraft.v[i*3+1]+asDraft.v[i*3+2])/3);
  S.assess[asDraft.s]={date:ymd(),items:asDraft.v.slice(),scores:sc};meetToday();save();showAssess(asDraft.s);}
function radar(sc,prev){var cx=160,cy=150,R=110,h='<svg viewBox="0 0 320 300" class="radar" role="img" aria-label="屬靈健康雷達圖">';
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/7;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  for(var lv=1;lv<=5;lv++){var ps=[];for(var i=0;i<7;i++){var p=pt(i,R*lv/5);ps.push(p[0].toFixed(1)+','+p[1].toFixed(1));}h+='<polygon points="'+ps.join(' ')+'" fill="none" stroke="var(--line)"/>';}
  for(var j=0;j<7;j++){var e=pt(j,R),t=pt(j,R+22);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)"/><text x="'+t[0].toFixed(1)+'" y="'+(t[1]+4).toFixed(1)+'" text-anchor="middle" font-size="12" fill="var(--mute)">'+MODULES[j].n+'</text>';}
  function poly(s,cls){var ps=[];for(var i=0;i<7;i++){var p=pt(i,R*s[i]/5);ps.push(p[0].toFixed(1)+','+p[1].toFixed(1));}return '<polygon points="'+ps.join(' ')+'" class="'+cls+'"/>';}
  if(prev)h+=poly(prev,'rp');h+=poly(sc,'rn');return h+'</svg>';}
function showAssess(stage){var a=S.assess[stage],prev=stage>0?S.assess[stage-1]:null,sc=a.scores;
  var hi=0,lo=0;for(var i=1;i<7;i++){if(sc[i]>sc[hi])hi=i;if(sc[i]<sc[lo])lo=i;}
  var b='<div class="stepbody"><div class="kick">'+STAGES[stage].n+'階段・'+nice(a.date)+'</div><h1 class="serif">我的屬靈健康圖</h1>'+radar(sc,prev?prev.scores:null)+
    (prev?'<div class="sub" style="text-align:center"><span class="lg rn"></span>本次　<span class="lg rp"></span>上一階段</div>':'')+
    '<div class="card"><div class="kick">神在你身上的恩典</div><div class="ttl">'+MODULES[hi].n+'</div><div class="sub">這是主在你生命中動工最明顯的地方，為此獻上感謝，把榮耀歸給耶穌。</div></div>'+
    '<div class="card"><div class="kick">下一階段可以邀請主動工的地方</div><div class="ttl">'+MODULES[lo].n+'</div><div class="sub">不是你的失敗，而是主要帶你走得更深的方向。課程中與「'+MODULES[lo].n+'」相關的週次，可以多花一點時間默想。</div></div>'+
    '<button class="btn full" data-act="addgrace" data-ty="自評">把這次的領受記入恩典簿</button><div style="height:10px"></div><button class="btn ghost full" data-act="close">完成</button></div>';
  openOv(ovHead('')+b);}

/* ---------- examen ---------- */
function openExamen(){var b='<div class="stepbody"><div class="big">省</div><div class="kick" style="margin-top:8px">晚間省察・檢討與修正</div><p class="sub">「'+dv('上帝')+'啊，求你鑒察我，知道我的心思，試煉我，知道我的意念，看在我裏面有甚麼惡行沒有，引導我走永生的道路。」（詩篇 139:23–24）</p>';
  each(EXAMEN,function(e){b+='<div class="q">'+e.t+'</div><div class="sub">'+e.h+'</div><textarea data-x="'+e.k+'"></textarea>';});
  b+='</div><div class="stepfoot"><button class="btn" data-act="exsave">交給主，安心睡覺</button></div>';
  openOv(ovHead('')+b);}
function saveExamen(){var a={},any=false;each($('ov').querySelectorAll('[data-x]'),function(e){a[e.getAttribute('data-x')]=e.value;if(e.value.replace(/\s/g,''))any=true;});
  if(!any){toast('寫一句也好，再小的恩典都算數');return;}
  S.journal.push({id:uid(),kind:'exam',date:ymd(),ts:Date.now(),a:a});meetToday();save();
  openOv(ovHead('')+'<div class="stepbody" style="text-align:center"><div class="done-mark">'+svg('check')+'</div><div class="ttl serif">「我必安然躺下睡覺」</div><p class="vs" style="font-size:1em">因為獨有你－耶和華使我安然居住。</p><p class="ref">詩篇 4:8</p><button class="btn ghost full" data-act="close">晚安</button></div>');}

function downloadAll(){var w=1,ok=0,btn=$('dlb');
  function nxt(){if(w>52){if(btn)btn.textContent='已下載 '+ok+' / 52 週';toast(ok===52?'全年課程已可離線使用':'部分週次下載失敗，請稍後再試');return;}

function exportData(){var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='321屬靈生活-備份-'+ymd()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('已匯出備份');}
function importData(f){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!d.v)throw 0;S=d;fill();save();closeOv();toast('已匯入備份');}catch(e){toast('檔案格式不正確');}};r.readAsText(f);}

  if(ob.i===0){b+='<img class="heroimg" src="hero.jpg" alt="321 十字架、聖經與禱告的人"><h1 class="serif" style="margin-top:14px">歡迎回家</h1><p class="vs" style="font-size:1.05em">「'+esc(APP_VERSE.t)+'」</p><p class="ref">'+APP_VERSE.ref+'</p><p>這不是一個打卡工具，而是一條每天「住在主裏」的路：一年 52 週、四個階段，從扎根、成長、結果到繁殖。三個小問題，讓我們為你預備起點。</p><label class="f" for="obn">我該怎麼稱呼你？（可略過）</label><input id="obn" value="'+esc(ob.name)+'">';}
  else if(ob.i===1){b+='<div class="kick" style="margin-top:20px">1 / 3</div><h1 class="serif">你信主多久了？</h1>';each(['還在認識耶穌','一年以內','一到五年','五年以上'],function(s){b+='<button class="opt'+(ob.since===s?' on':'')+'" data-act="obs" data-s="'+s+'">'+s+'</button>';});}
  else if(ob.i===2){b+='<div class="kick" style="margin-top:20px">2 / 3</div><h1 class="serif">每天大約有多少時間？</h1>';each([[10,'10 分鐘・精簡四步'],[20,'20 分鐘・完整六步（建議）'],[30,'30 分鐘・六步加延伸閱讀']],function(m){b+='<button class="opt'+(ob.mins===m[0]?' on':'')+'" data-act="obm" data-m="'+m[0]+'">'+m[1]+'</button>';});b+='<p class="sub">隨時可以在設定裏調整。</p>';}
  else {b+='<div class="kick" style="margin-top:20px">3 / 3</div><h1 class="serif">你最渴望在哪方面成長？</h1><p class="sub">可複選</p>';each(MODULES,function(m,i){b+='<button class="chip'+(ob.grow.indexOf(i)>=0?' on':'')+'" data-act="obg" data-i="'+i+'">'+m.n+'</button>';});}
  b+='</div><div class="stepfoot">'+(ob.i>0?'<button class="btn ghost" data-act="obp">上一步</button>':'')+'<button class="btn" data-act="obn">'+(ob.i===3?'開始第一課':'下一步')+'</button></div>';
  openOv('<div class="ovh"><div></div><div></div><div style="width:44px"></div></div>'+b);}
function obNext(){if(ob.i===0){var n=$('obn');ob.name=n?n.value.replace(/^\s+|\s+$/g,''):'';}
  if(ob.i<3){ob.i++;openOnboard();return;}
  S.name=ob.name;S.since=ob.since;S.mins=ob.mins;S.grow=ob.grow;S.onboard=true;S.start=ymd();save();
  $('ov').className='ov';render();startFlow(lid(1,1));}

/* ---------- memory cards ---------- */
var IV=[1,2,4,7,14,30,60];
function gradeCard(ok){var due=[];each(memList(),function(c){if(cardDue(c))due.push(c);});var c=due[cardIdx];if(!c)return;
  var r=S.cards[c.ref]||{lvl:0};r.lvl=ok?Math.min(r.lvl+1,IV.length-1):0;r.due=addDays(ymd(),ok?IV[r.lvl]:1);S.cards[c.ref]=r;
  if(!ok)cardIdx++;cardShow=false;save();render();if(ok)toast('下次複習：'+nice(r.due));}

/* ---------- TTS ---------- */
var audio=null,speaking=false;
function stopSpeak(){speaking=false;if(audio){try{audio.pause();}catch(e){}audio=null;}if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}}
function speak(text,btn){if(speaking){stopSpeak();setBtn(btn,false);return;}
  speaking=true;setBtn(btn,true);
  var done=function(){speaking=false;setBtn(btn,false);};
  var fallback=function(){if(!speaking)return;if(!window.speechSynthesis){toast('此裝置不支援朗讀');done();return;}
    var u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.9;u.onend=done;u.onerror=done;speechSynthesis.speak(u);};
  try{
    var x=new XMLHttpRequest();x.open('POST',TTS_URL,true);x.responseType='blob';x.timeout=15000;x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){if(x.status===200&&x.response&&x.response.size>500&&speaking){audio=new Audio(URL.createObjectURL(x.response));audio.onended=done;audio.onerror=fallback;var pr=audio.play();if(pr&&pr['catch'])pr['catch'](fallback);}else fallback();};
    x.onerror=fallback;x.ontimeout=fallback;
    x.send(JSON.stringify({voice:TTS_VOICE,rate:'-5%',text:text}));
  }catch(e){fallback();}
}
function setBtn(btn,on){if(!btn)return;var s=btn.querySelector('span');if(s)s.textContent=on?'停止':'聽經文';}
function refSpeech(r){return r.replace(/(\d+):(\d+)[–-](\d+)/,'$1章$2到$3節').replace(/(\d+):(\d+)$/,'$1章$2節');}

/* ---------- events ---------- */
function actEl(el){while(el&&el!==document){if(el.getAttribute&&el.getAttribute('data-act'))return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(ev){var el=actEl(ev.target);if(!el)return;var a=el.getAttribute('data-act');
  switch(a){
  case 'tab':if($('ov').className.indexOf('show')>=0)closeOv();go(el.getAttribute('data-v'));break;
  case 'start':startFlow(el.getAttribute('data-id'));break;
  case 'next':grabInputs();flow.i++;drawFlow();break;
  case 'prev':grabInputs();flow.i--;drawFlow();break;
  case 'finish':finishFlow();break;
  case 'close':if(flow&&!flow.done)grabInputs();closeOv();break;
  case 'pick':grabInputs();S.draft[flow.L.id].act=flow.L.acts[+el.getAttribute('data-i')];save();drawFlow();break;
  case 'speak':var t='';each(flow.L.passages,function(p){t+=refSpeech(p.ref)+'。';each(p.v,function(v){t+=dv(v[1]);});});speak(t,el);break;
  case 'noon':meetToday();save();toast('願主的平安充滿你');render();break;
  case 'examen':openExamen();break;
  case 'exsave':saveExamen();break;
  case 'addgrace':grabInputs();flow=null;openGraceForm(el.getAttribute('data-ty')||'恩典');break;
  case 'gsave':saveGrace(el.getAttribute('data-ty'));break;
  case 'gf':graceFilter=el.getAttribute('data-f');render();break;
  case 'stage':courseStage=+el.getAttribute('data-i');openWeek=0;render();break;
  case 'week':var w=+el.getAttribute('data-w');openWeek=openWeek===w?0:w;render();break;
  case 'assess':grabInputs();flow=null;var s=+el.getAttribute('data-s');if(S.assess[s]&&el.getAttribute('data-show')!=='0'&&!confirm('這一階段已自評過，要重新自評嗎？')){showAssess(s);}else openAssess(s);break;
  case 'asv':asDraft.v[+el.getAttribute('data-k')]=+el.getAttribute('data-n');drawAssess();break;
  case 'assave':saveAssess();break;
  case 'flip':cardShow=!cardShow;render();break;
  case 'card':gradeCard(el.getAttribute('data-ok')==='1');break;
  case 'padd':var v=$('pin').value;if(!v.replace(/\s/g,''))return;S.prayers.unshift({id:uid(),text:v,date:ymd(),answered:null});save();render();toast('已加入禱告清單');break;
  case 'pans':var p=findP(el.getAttribute('data-id'));if(!p)return;var note=prompt('神怎樣應允了？（可略過）','')||'';p.answered=ymd();p.note=note;S.grace.push({id:uid(),date:ymd(),ts:Date.now(),type:'禱告蒙應允',text:p.text+(note?'——'+note:'')});meetToday();save();render();toast('感謝主！已記入恩典記錄簿');break;
  case 'pdel':if(confirm('刪除這個禱告事項？')){var q=findP(el.getAttribute('data-id'));S.prayers.splice(S.prayers.indexOf(q),1);save();render();}break;
  case 'partner':openPartner();break;
  case 'psave':S.partner=$('ptn').value;save();closeOv();toast('已儲存');break;
  case 'pshare':S.partner=$('ptn').value;save();shareInvite();break;
  case 'settings':openSettings();break;
  case 'smins':S.mins=+el.getAttribute('data-m');keepSettings();break;
  case 'sfont':S.font=+el.getAttribute('data-f');keepSettings();break;
  case 'sgw':S.gw=el.getAttribute('data-g');keepSettings();break;
  case 'stheme':S.theme=el.getAttribute('data-t');keepSettings();break;
  case 'ssave':S.name=$('sn').value.replace(/^\s+|\s+$/g,'');save();closeOv();toast('已儲存');break;
  case 'dlall':downloadAll();break;
  case 'export':exportData();break;
  case 'import':$('impf').click();break;
  case 'reset':if(confirm('確定清除所有日誌、禱告與進度？此動作無法復原。')){S=blank();save();closeOv();ob={i:0,since:'',mins:20,grow:[],name:''};openOnboard();}break;
  case 'obs':ob.since=el.getAttribute('data-s');openOnboard();break;
  case 'obm':ob.mins=+el.getAttribute('data-m');openOnboard();break;
  case 'obg':var gi=+el.getAttribute('data-i'),ix=ob.grow.indexOf(gi);if(ix>=0)ob.grow.splice(ix,1);else ob.grow.push(gi);openOnboard();break;
  case 'obn':if(ob.i===1&&!ob.since){toast('請選一項');return;}obNext();break;
  case 'obp':ob.i--;openOnboard();break;
  }
});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='impf'&&ev.target.files[0])importData(ev.target.files[0]);});
function keepSettings(){var n=$('sn');if(n)S.name=n.value;save();applyTheme();var y=$('ov').scrollTop;openSettings();$('ov').scrollTop=y;}
function findP(id){for(var i=0;i<S.prayers.length;i++)if(S.prayers[i].id===id)return S.prayers[i];return null;}

/* ---------- boot ---------- */
function boot(){load();prepWeek(W1);
  var nav='';each([['today','今日'],['course','課程'],['verse','經文'],['pray','禱告'],['grace','恩典']],function(n){nav+='<button data-act="tab" data-v="'+n[0]+'">'+svg(n[0])+n[1]+'</button>';});
  $('tabs').innerHTML=nav;$('gear').innerHTML=svg('gear');
  render();
  if(!S.onboard)openOnboard();
  S.lastOpen=ymd();save();
  setInterval(function(){if(S.theme==='auto'&&!flow)applyTheme();},600000);
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
}
boot();
})();
</script>

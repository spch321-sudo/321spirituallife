.empty{text-align:center;color:var(--mute);padding:26px 10px}
.foot{text-align:center;color:var(--mute);font-size:.82em;margin:28px 0 8px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:.92em}
.done-mark{width:84px;height:84px;margin:30px auto 10px;border-radius:50%;background:var(--accS);display:flex;align-items:center;justify-content:center}
.done-mark svg{width:42px;height:42px;stroke:var(--acc)}

.btn{white-space:nowrap;flex:none}
.btn svg{width:18px;height:18px;stroke:currentColor}
.heroimg{display:block;width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:22px;margin:18px auto 0;box-shadow:0 8px 28px rgba(60,45,20,.18)}
html[data-th=night] .btn.ghost{color:var(--acc)}
</style>

  pray:'天父，謝謝你在我還相離很遠的時候，就看見我、跑向我。我不再用自己的表現來換你的愛，我承認我需要你。今天我回家了，求你作我生命的主。奉主耶穌的名，阿們。',

function load2(){var b=blank();for(var k in b)if(!(k in S))S[k]=b[k];}

/* ---------- onboarding ---------- */
var ob={i:0,since:'',mins:20,grow:[],name:''};
function openOnboard(){var b='<div class="stepbody">';
  if(ob.i===0){b+='<img class="heroimg" src="hero.jpg" alt="321 十字架、聖經與禱告的人"><h1 class="serif" style="margin-top:14px">歡迎回家</h1><p class="vs" style="font-size:1.05em">「'+esc(APP_VERSE.t)+'」</p><p class="ref">'+APP_VERSE.ref+'</p><p>這不是一個打卡工具，而是一條每天「住在主裏」的路。三個小問題，讓我們為你預備起點。</p><label class="f" for="obn">我該怎麼稱呼你？（可略過）</label><input id="obn" value="'+esc(ob.name)+'">';}
  else if(ob.i===1){b+='<div class="kick" style="margin-top:20px">1 / 3</div><h1 class="serif">你信主多久了？</h1>';each(['還在認識耶穌','一年以內','一到五年','五年以上'],function(s){b+='<button class="opt'+(ob.since===s?' on':'')+'" data-act="obs" data-s="'+s+'">'+s+'</button>';});}
  else if(ob.i===2){b+='<div class="kick" style="margin-top:20px">2 / 3</div><h1 class="serif">每天大約有多少時間？</h1>';each([[10,'10 分鐘・精簡四步'],[20,'20 分鐘・完整六步（建議）'],[30,'30 分鐘・六步加延伸閱讀']],function(m){b+='<button class="opt'+(ob.mins===m[0]?' on':'')+'" data-act="obm" data-m="'+m[0]+'">'+m[1]+'</button>';});b+='<p class="sub">隨時可以在設定裏調整。</p>';}
  else {b+='<div class="kick" style="margin-top:20px">3 / 3</div><h1 class="serif">你最渴望在哪方面成長？</h1><p class="sub">可複選</p>';each(MODULES,function(m,i){b+='<button class="chip'+(ob.grow.indexOf(i)>=0?' on':'')+'" data-act="obg" data-i="'+i+'">'+m.n+'</button>';});}
  b+='</div><div class="stepfoot">'+(ob.i>0?'<button class="btn ghost" data-act="obp">上一步</button>':'')+'<button class="btn" data-act="obn">'+(ob.i===3?'開始第一課':'下一步')+'</button></div>';
  openOv('<div class="ovh"><div></div><div></div><div style="width:44px"></div></div>'+b);}
function obNext(){if(ob.i===0){var n=$('obn');ob.name=n?n.value.replace(/^\s+|\s+$/g,''):'';}
  if(ob.i<3){ob.i++;openOnboard();return;}
  S.name=ob.name;S.since=ob.since;S.mins=ob.mins;S.grow=ob.grow;S.onboard=true;S.start=ymd();save();
  $('ov').className='ov';render();startFlow(LESSONS[0].id);}

/* ---------- memory cards ---------- */
var IV=[1,2,4,7,14,30];
function gradeCard(ok){var due=[];each(MEMORY,function(c){if(cardDue(c))due.push(c);});var c=due[cardIdx];if(!c)return;
  var r=S.cards[c.ref]||{lvl:0};r.lvl=ok?Math.min(r.lvl+1,IV.length-1):0;r.due=addDays(ymd(),ok?IV[r.lvl]:1);S.cards[c.ref]=r;
  if(!ok)cardIdx++;cardShow=false;save();render();if(ok)toast('下次複習：'+nice(r.due));}

/* ---------- TTS ---------- */
var audio=null,speaking=false;
function stopSpeak(){speaking=false;if(audio){try{audio.pause();}catch(e){}audio=null;}if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}}
function speak(text,btn){if(speaking){stopSpeak();setBtn(btn,false);return;}
  speaking=true;setBtn(btn,true);
  var done=function(){speaking=false;setBtn(btn,false);};
  var fallback=function(){if(!speaking)return;if(!window.speechSynthesis){toast('此裝置不支援朗讀');done();return;}
    var u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.9;u.onend=done;u.onerror=done;speechSynthesis.speak(u);};
  try{
    var x=new XMLHttpRequest();x.open('POST',TTS_URL,true);x.responseType='blob';x.timeout=15000;x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){if(x.status===200&&x.response&&x.response.size>500&&speaking){audio=new Audio(URL.createObjectURL(x.response));audio.onended=done;audio.onerror=fallback;var pr=audio.play();if(pr&&pr['catch'])pr['catch'](fallback);}else fallback();};
    x.onerror=fallback;x.ontimeout=fallback;
    x.send(JSON.stringify({voice:TTS_VOICE,rate:'-5%',text:text}));
  }catch(e){fallback();}
}
function setBtn(btn,on){if(!btn)return;var s=btn.querySelector('span');if(s)s.textContent=on?'停止':'聽經文';}

/* ---------- events ---------- */
function actEl(el){while(el&&el!==document){if(el.getAttribute&&el.getAttribute('data-act'))return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(ev){var el=actEl(ev.target);if(!el)return;var a=el.getAttribute('data-act');
  switch(a){
  case 'tab':if($('ov').className.indexOf('show')>=0)closeOv();go(el.getAttribute('data-v'));break;
  case 'start':startFlow(el.getAttribute('data-id'));break;
  case 'next':grabInputs();flow.i++;drawFlow();break;
  case 'prev':grabInputs();flow.i--;drawFlow();break;
  case 'finish':finishFlow();break;
  case 'close':if(flow&&!flow.done)grabInputs();closeOv();break;
  case 'pick':grabInputs();var A=S.draft[flow.L.id];A.act=flow.L.acts[+el.getAttribute('data-i')];save();drawFlow();break;
  case 'speak':var t='';each(flow.L.passages,function(p){t+=p.ref.replace(/(\d+):(\d+)[–-](\d+)/,'$1章$2到$3節').replace(/(\d+):(\d+)$/,'$1章$2節')+'。';each(p.v,function(v){t+=v[1];});});speak(t,el);break;
  case 'noon':meetToday();save();toast('願主的平安充滿你的下午');render();break;
  case 'examen':openExamen();break;
  case 'exsave':saveExamen();break;
  case 'addgrace':openGraceForm(el.getAttribute('data-ty')||'恩典');break;
  case 'gsave':saveGrace(el.getAttribute('data-ty'));break;
  case 'gf':graceFilter=el.getAttribute('data-f');render();break;
  case 'stage':courseStage=+el.getAttribute('data-i');render();break;
  case 'flip':cardShow=!cardShow;render();break;
  case 'card':gradeCard(el.getAttribute('data-ok')==='1');break;
  case 'padd':var v=$('pin').value;if(!v.replace(/\s/g,''))return;S.prayers.unshift({id:uid(),text:v,date:ymd(),answered:null});save();render();toast('已加入禱告清單');break;
  case 'pans':var p=findP(el.getAttribute('data-id'));if(!p)return;var note=prompt('神怎樣應允了？（可略過）','')||'';p.answered=ymd();p.note=note;S.grace.push({id:uid(),date:ymd(),ts:Date.now(),type:'禱告蒙應允',text:p.text+(note?'——'+note:'')});meetToday();save();render();toast('感謝主！已記入恩典記錄簿');break;
  case 'pdel':if(confirm('刪除這個禱告事項？')){var q=findP(el.getAttribute('data-id'));S.prayers.splice(S.prayers.indexOf(q),1);save();render();}break;
  case 'partner':openPartner();break;
  case 'psave':S.partner=$('ptn').value;save();closeOv();toast('已儲存');break;
  case 'pshare':S.partner=$('ptn').value;save();shareInvite();break;
  case 'settings':openSettings();break;
  case 'smins':S.mins=+el.getAttribute('data-m');keepSettings();break;
  case 'sfont':S.font=+el.getAttribute('data-f');keepSettings();break;
  case 'stheme':S.theme=el.getAttribute('data-t');keepSettings();break;
  case 'ssave':S.name=$('sn').value.replace(/^\s+|\s+$/g,'');save();closeOv();toast('已儲存');break;
  case 'export':exportData();break;
  case 'import':$('impf').click();break;
  case 'reset':if(confirm('確定清除所有日誌、禱告與進度？此動作無法復原。')){S=blank();save();closeOv();ob={i:0,since:'',mins:20,grow:[],name:''};openOnboard();}break;
  case 'obs':ob.since=el.getAttribute('data-s');openOnboard();break;
  case 'obm':ob.mins=+el.getAttribute('data-m');openOnboard();break;
  case 'obg':var gi=+el.getAttribute('data-i'),ix=ob.grow.indexOf(gi);if(ix>=0)ob.grow.splice(ix,1);else ob.grow.push(gi);openOnboard();break;
  case 'obn':if(ob.i===1&&!ob.since){toast('請選一項');return;}obNext();break;
  case 'obp':ob.i--;openOnboard();break;
  }
});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='impf'&&ev.target.files[0])importData(ev.target.files[0]);});
function keepSettings(){var n=$('sn');if(n)S.name=n.value;save();applyTheme();openSettings();}
function findP(id){for(var i=0;i<S.prayers.length;i++)if(S.prayers[i].id===id)return S.prayers[i];return null;}

/* ---------- boot ---------- */
function boot(){load();
  var nav='';each([['today','今日'],['course','課程'],['verse','經文'],['pray','禱告'],['grace','恩典']],function(n){nav+='<button data-act="tab" data-v="'+n[0]+'">'+svg(n[0])+n[1]+'</button>';});
  $('tabs').innerHTML=nav;$('gear').innerHTML=svg('gear');
  render();
  if(!S.onboard)openOnboard();
  S.lastOpen=ymd();save();
  setInterval(function(){if(S.theme==='auto')applyTheme();},600000);
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
}
boot();
})();
</script>
